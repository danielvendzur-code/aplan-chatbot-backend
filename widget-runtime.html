<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aplan Asistent</title>
<style>html,body{margin:0;background:transparent}</style>
</head>
<body>
<script>
(async function loadAplanWidget(){
  try{
    const response=await fetch('/widget.html?v=20260817-1',{cache:'no-cache'});
    if(!response.ok) throw new Error('widget_load_failed');
    let html=await response.text();

    // Automatický preview banner je vypnutý. Launcher ostáva čistý a preview sa
    // zobrazuje iba pri skutočnom hoveri nad tlačidlom cez launcher-hover.js.
    html=html.replace('setTimeout(aiTeaserShow,2600);','/* automatic teaser disabled */');

    const noTeaser='<style>#ai-teaser{display:none!important}</style>';
    const polish='<link rel="stylesheet" href="/ui-polish.css?v=20260817-1">';
    const upgrade='<script src="/production-upgrade.js?v=20260817-1"><\/script>';
    const hoverBridge='<script src="/launcher-hover.js?v=20260817-1"><\/script>';

    if(html.includes('</head>')) html=html.replace('</head>',noTeaser+polish+'</head>');
    else html=noTeaser+polish+html;

    if(html.includes('</body>')) html=html.replace('</body>',upgrade+hoverBridge+'</body>');
    else html+=upgrade+hoverBridge;

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div style="font:600 13px Arial,sans-serif;padding:18px;color:#555">Asistenta sa nepodarilo načítať. Skúste obnoviť stránku.</div>';
  }
})();
</script>
</body>
</html>
